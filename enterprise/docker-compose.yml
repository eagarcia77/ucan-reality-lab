services:
  frontend:
    build: ./frontend
    ports:
      - "${UCAN_ENTERPRISE_PORT:-8170}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ucan:${POSTGRES_PASSWORD:-ucan_dev_password}@db:5432/ucan
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${UCAN_ENTERPRISE_PORT:-8170}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ucan
      POSTGRES_USER: ucan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucan_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucan -d ucan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ucanadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ucan_dev_storage_password}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-8171}:9001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
