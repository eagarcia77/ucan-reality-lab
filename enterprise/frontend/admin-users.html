<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar cuentas · UCAN Reality Lab</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#14231e;background:#eef5f2;--g:#08775d;--dg:#073f32}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,var(--dg),var(--g));color:#fff;padding:1.2rem 2rem}.wrap{max-width:1200px;margin:auto;padding:1.2rem}.card{background:#fff;border:1px solid #d6e4de;border-radius:16px;padding:1.1rem;margin-bottom:1rem}.grid{display:grid;grid-template-columns:1fr 2fr;gap:1rem}input,select{width:100%;padding:.7rem;margin:.25rem 0 .7rem;border:1px solid #9cb9ae;border-radius:9px}button,a{border:0;border-radius:9px;padding:.7rem .85rem;background:var(--g);color:#fff;font-weight:800;text-decoration:none;cursor:pointer;margin:.15rem}.secondary{background:#dfece7;color:#075e49}.danger{background:#a52a2a}.user{border-bottom:1px solid #dce8e3;padding:1rem 0}.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.muted{color:#52675f}.error{color:#a32323}.success{color:#08775d}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Administración de cuentas</h1><p>UCAN Reality Lab v8.2</p></header><main class="wrap"><a class="secondary" href="/">← Mis proyectos</a><section class="grid"><form id="createForm" class="card"><h2>Crear cuenta</h2><label>Nombre completo</label><input id="name" required minlength="3"><label>Correo institucional</label><input id="email" type="email" required placeholder="usuario@intersg.edu"><label>Contraseña temporal</label><input id="password" type="password" required minlength="10"><label>Rol</label><select id="role"><option value="professor">Profesor</option><option value="reviewer">Revisor</option><option value="admin">Administrador</option></select><button>Crear cuenta</button><p id="createMessage"></p></form><section class="card"><div class="row"><h2 style="flex:1">Cuentas registradas</h2><button id="refresh" type="button">Actualizar</button></div><input id="search" placeholder="Buscar por nombre o correo"><div id="users">Cargando…</div></section></section></main><script>(()=>{const API=location.hostname.endsWith('onrender.com')?'https://ucan-reality-lab.onrender.com/api':'/api',token=localStorage.getItem('ucan_access_token')||'',H={'Content-Type':'application/json',Authorization:`Bearer ${token}`},$=id=>document.getElementById(id);let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(r){const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||`Error ${r.status}`);return b}function render(){const q=$('search').value.toLowerCase();const list=all.filter(u=>(u.full_name+' '+u.email).toLowerCase().includes(q));$('users').innerHTML=list.length?list.map(u=>`<article class="user" data-id="${u.id}"><b>${esc(u.full_name)}</b><div class="muted">${esc(u.email)} · ${u.is_active?'Activa':'Desactivada'}</div><div class="row"><select class="role"><option value="professor" ${u.role==='professor'?'selected':''}>Profesor</option><option value="reviewer" ${u.role==='reviewer'?'selected':''}>Revisor</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrador</option></select><button class="save">Guardar rol</button><button class="toggle secondary">${u.is_active?'Desactivar':'Activar'}</button><button class="reset secondary">Cambiar contraseña</button><button class="delete danger">Eliminar</button></div></article>`).join(''):'<p>No hay cuentas.</p>';document.querySelectorAll('.user').forEach(card=>{const id=card.dataset.id,user=all.find(x=>x.id===id);card.querySelector('.save').onclick=()=>patch(id,{role:card.querySelector('.role').value});card.querySelector('.toggle').onclick=()=>patch(id,{is_active:!user.is_active});card.querySelector('.reset').onclick=async()=>{const p=prompt('Escriba una contraseña temporal de 10 caracteres o más:');if(!p)return;if(p.length<10)return alert('La contraseña es demasiado corta.');try{await j(await fetch(`${API}/admin/users/${id}/reset-password`,{method:'POST',headers:H,body:JSON.stringify({new_password:p})}));alert('Contraseña actualizada.')}catch(e){alert(e.message)}};card.querySelector('.delete').onclick=async()=>{if(!confirm(`¿Eliminar la cuenta ${user.email}?`))return;try{await fetch(`${API}/admin/users/${id}`,{method:'DELETE',headers:H});load()}catch(e){alert(e.message)}}})}async function patch(id,payload){try{await j(await fetch(`${API}/admin/users/${id}`,{method:'PATCH',headers:H,body:JSON.stringify(payload)}));load()}catch(e){alert(e.message)}}async function load(){try{all=await j(await fetch(`${API}/admin/users`,{headers:H}));render()}catch(e){$('users').innerHTML=`<p class="error">${esc(e.message)}. Esta página requiere rol de administrador.</p>`}}$('createForm').onsubmit=async e=>{e.preventDefault();const m=$('createMessage');m.textContent='Creando…';try{await j(await fetch(`${API}/admin/users`,{method:'POST',headers:H,body:JSON.stringify({full_name:$('name').value,email:$('email').value.trim(),password:$('password').value,role:$('role').value})}));e.target.reset();m.className='success';m.textContent='Cuenta creada correctamente.';load()}catch(err){m.className='error';m.textContent=err.message}};$('refresh').onclick=load;$('search').oninput=render;load()})();</script></body></html>
