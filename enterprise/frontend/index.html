<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UCAN Reality Lab Enterprise v7.2 Cloud</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#13221d;background:#eef5f2}*{box-sizing:border-box}body{margin:0}header{background:#073f32;color:white;padding:1.25rem 2rem}.header-row{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}main{max-width:1120px;margin:auto;padding:2rem}.grid{display:grid;grid-template-columns:360px 1fr;gap:1.5rem}.card{background:white;border:1px solid #d6e4de;border-radius:16px;padding:1.25rem;box-shadow:0 8px 24px #0b3f3220}label{display:block;font-weight:700;margin-top:1rem}input,textarea,select{width:100%;margin-top:.4rem;padding:.75rem;border:1px solid #9cb9ae;border-radius:10px;font:inherit}button{margin-top:1rem;border:0;border-radius:10px;padding:.8rem 1rem;background:#08775d;color:white;font-weight:800;cursor:pointer}.secondary{background:#dfece7;color:#075e49}.header-row button{margin:0;background:#fff;color:#075e49}button:focus,input:focus,textarea:focus,select:focus{outline:3px solid #f6c84c;outline-offset:2px}.project{border-bottom:1px solid #dde8e3;padding:1rem 0}.muted{color:#52675f}.status{display:inline-block;background:#e5f4ee;color:#075e49;padding:.25rem .55rem;border-radius:999px;font-size:.8rem}.error{color:#9c1c1c}.success{color:#086b52}.empty{padding:2rem;text-align:center;color:#52675f}.hidden{display:none!important}.login{max-width:460px;margin:3rem auto}.badge{font-size:.82rem;background:#e5f4ee;color:#075e49;border-radius:999px;padding:.25rem .55rem}@media(max-width:800px){.grid{grid-template-columns:1fr}.header-row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><div class="header-row"><div><h1>UCAN Reality Lab Enterprise v7.2 Cloud</h1><p>Acceso seguro, proyectos persistentes y despliegue preparado para la nube</p></div><div id="sessionArea" class="hidden"><span id="userBadge" class="badge"></span> <button id="logoutButton" type="button">Cerrar sesión</button></div></div></header>
<main>
  <section id="loginView" class="card login">
    <h2>Iniciar sesión</h2>
    <p class="muted">Acceda con su cuenta institucional para administrar proyectos.</p>
    <form id="loginForm">
      <label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="username">
      <label for="password">Contraseña</label><input id="password" type="password" required minlength="8" autocomplete="current-password">
      <button type="submit">Entrar</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="dashboardView" class="grid hidden" aria-label="Panel de proyectos">
    <form id="projectForm" class="card">
      <h2>Nuevo proyecto</h2>
      <label for="title">Título</label><input id="title" required minlength="3" maxlength="160">
      <label for="course">Curso</label><input id="course" maxlength="120">
      <label for="level">Nivel académico</label><select id="level"><option>Subgraduado</option><option>Maestría</option><option>Doctorado</option><option>Educación continua</option></select>
      <label for="description">Descripción</label><textarea id="description" rows="6" maxlength="2000"></textarea>
      <button type="submit">Crear proyecto</button>
      <p id="formMessage" role="status" aria-live="polite"></p>
    </form>
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem"><h2>Mis proyectos</h2><button id="refreshButton" class="secondary" type="button">Actualizar</button></div>
      <div id="projects" class="empty">Inicie sesión para cargar proyectos.</div>
    </section>
  </section>
</main>
<script>
const API = window.location.hostname.endsWith('onrender.com')
  ? 'https://ucan-reality-lab.onrender.com/api'
  : '/api';
let token=localStorage.getItem('ucan_access_token')||'';
let currentUser=null;
const list=document.querySelector('#projects');
const message=document.querySelector('#formMessage');
function escapeHtml(value=''){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function authHeaders(extra={}){return {...extra,Authorization:`Bearer ${token}`};}
function showLogin(error=''){
  currentUser=null;token='';localStorage.removeItem('ucan_access_token');
  loginView.classList.remove('hidden');dashboardView.classList.add('hidden');sessionArea.classList.add('hidden');
  loginMessage.className=error?'error':'';loginMessage.textContent=error;
}
function showDashboard(user){
  currentUser=user;loginView.classList.add('hidden');dashboardView.classList.remove('hidden');sessionArea.classList.remove('hidden');
  userBadge.textContent=`${user.full_name} · ${user.role}`;
  projectForm.classList.toggle('hidden',user.role==='reviewer');
}
async function verifySession(){
  if(!token){showLogin();return;}
  try{const response=await fetch(`${API}/auth/me`,{headers:authHeaders()});if(!response.ok)throw new Error();const user=await response.json();showDashboard(user);await loadProjects();}
  catch{showLogin('La sesión expiró o el servidor no está disponible. Inicie sesión nuevamente.');}
}
async function loadProjects(){
  list.className='empty';list.textContent='Cargando proyectos…';
  try{
    const response=await fetch(`${API}/projects`,{headers:authHeaders()});if(response.status===401){showLogin('La sesión expiró.');return;}if(!response.ok)throw new Error('No fue posible cargar los proyectos.');
    const projects=await response.json();
    if(!projects.length){list.className='empty';list.textContent='Todavía no hay proyectos disponibles.';return;}
    list.className='';
    list.innerHTML=projects.map(p=>`<article class="project"><span class="status">${escapeHtml(p.status)}</span><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.description||'Sin descripción')}</p><p class="muted">${escapeHtml(p.course||'Curso no especificado')} · ${escapeHtml(p.academic_level)} · versión ${p.version}</p></article>`).join('');
  }catch(error){list.className='error';list.textContent=error.message;}
}
loginForm.addEventListener('submit',async event=>{
  event.preventDefault();loginMessage.className='';loginMessage.textContent='Validando credenciales…';
  try{
    const response=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
    const body=await response.json();if(!response.ok)throw new Error(body.detail||'No fue posible iniciar sesión.');
    token=body.access_token;localStorage.setItem('ucan_access_token',token);showDashboard(body.user);loginMessage.textContent='';await loadProjects();
  }catch(error){loginMessage.className='error';loginMessage.textContent=error.message;}
});
projectForm.addEventListener('submit',async event=>{
  event.preventDefault();message.className='';message.textContent='Creando proyecto…';
  const payload={title:title.value,course:course.value,academic_level:level.value,description:description.value};
  try{
    const response=await fetch(`${API}/projects`,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(payload)});
    const detail=await response.json();if(!response.ok)throw new Error(detail.detail||'No fue posible crear el proyecto.');
    event.target.reset();message.className='success';message.textContent='Proyecto creado correctamente.';await loadProjects();
  }catch(error){message.className='error';message.textContent=error.message;}
});
logoutButton.addEventListener('click',()=>showLogin('Sesión cerrada correctamente.'));
refreshButton.addEventListener('click',loadProjects);
verifySession();
</script>
</body>
</html>
