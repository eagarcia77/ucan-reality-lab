<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCAN Reality Lab Enterprise v7.5</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#13221d;background:#eef5f2}*{box-sizing:border-box}body{margin:0}header{background:#073f32;color:#fff;padding:1.2rem 2rem}main{max-width:1120px;margin:auto;padding:2rem}.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.grid{display:grid;grid-template-columns:360px 1fr;gap:1.5rem}.card{background:#fff;border:1px solid #d6e4de;border-radius:16px;padding:1.25rem;box-shadow:0 8px 24px #0b3f3220}label{display:block;font-weight:700;margin-top:1rem}input,textarea,select{width:100%;margin-top:.4rem;padding:.75rem;border:1px solid #9cb9ae;border-radius:10px;font:inherit}button,a.btn{display:inline-block;margin-top:1rem;border:0;border-radius:10px;padding:.8rem 1rem;background:#08775d;color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#dfece7!important;color:#075e49!important}.project{border-bottom:1px solid #dde8e3;padding:1rem 0}.muted{color:#52675f}.status,.badge{display:inline-block;background:#e5f4ee;color:#075e49;padding:.25rem .55rem;border-radius:999px;font-size:.82rem}.error{color:#9c1c1c}.success{color:#086b52}.empty{padding:2rem;text-align:center;color:#52675f}.hidden{display:none!important}.login{max-width:500px;margin:3rem auto}.tabs{display:flex;gap:.5rem;margin-bottom:1rem}.tabs button{flex:1;margin:0}.tabs .active{background:#073f32}.notice{background:#fff5d6;border-left:4px solid #f2be2e;padding:.8rem 1rem;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="row"><div><h1>UCAN Reality Lab Enterprise</h1><p>v7.5 · Studio Guiado y publicación para múltiples LMS</p></div><div id="sessionArea" class="hidden"><span id="userBadge" class="badge"></span> <button id="logoutButton" class="secondary">Cerrar sesión</button></div></div></header><main><section id="authView" class="card login"><div class="tabs"><button id="loginTab" class="active">Iniciar sesión</button><button id="registerTab" class="secondary">Registrarse</button></div><section id="loginPanel"><h2>Iniciar sesión</h2><form id="loginForm"><label>Correo institucional</label><input id="email" type="email" required><label>Contraseña</label><input id="password" type="password" required minlength="8"><button>Entrar</button><p id="loginMessage"></p></form></section><section id="registerPanel" class="hidden"><h2>Crear cuenta</h2><p class="notice">Solo correos institucionales autorizados.</p><p id="domainHelp" class="muted"></p><form id="registerForm"><label>Nombre completo</label><input id="registerName" required minlength="3"><label>Correo institucional</label><input id="registerEmail" type="email" required><label>Contraseña</label><input id="registerPassword" type="password" required minlength="10"><label>Confirmar contraseña</label><input id="registerPasswordConfirm" type="password" required minlength="10"><button>Crear cuenta</button><p id="registerMessage"></p></form></section></section><section id="dashboardView" class="grid hidden"><form id="projectForm" class="card"><h2>Nuevo proyecto</h2><label>Título</label><input id="title" required minlength="3"><label>Curso</label><input id="course"><label>Nivel académico</label><select id="level"><option>Subgraduado</option><option>Maestría</option><option>Doctorado</option><option>Educación continua</option></select><label>Descripción</label><textarea id="description" rows="6"></textarea><button>Crear proyecto</button><p id="formMessage"></p></form><section class="card"><div class="row"><div><h2>Mis proyectos</h2><p class="muted">Abra un proyecto para diseñar la actividad y exportarla a su LMS.</p></div><button id="refreshButton" class="secondary">Actualizar</button></div><div id="projects" class="empty">Cargando…</div></section></section></main><script>const API=location.hostname.endsWith('onrender.com')?'https://ucan-reality-lab.onrender.com/api':'/api';let token=localStorage.getItem('ucan_access_token')||'',currentUser=null;const byId=id=>document.getElementById(id),authHeaders=(extra={})=>({...extra,Authorization:`Bearer ${token}`}),esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tab(mode){const reg=mode==='register';byId('loginPanel').classList.toggle('hidden',reg);byId('registerPanel').classList.toggle('hidden',!reg);byId('loginTab').className=reg?'secondary':'active';byId('registerTab').className=reg?'active':'secondary'}function showLogin(msg=''){token='';localStorage.removeItem('ucan_access_token');byId('authView').classList.remove('hidden');byId('dashboardView').classList.add('hidden');byId('sessionArea').classList.add('hidden');byId('loginMessage').textContent=msg;tab('login')}function showDashboard(u){currentUser=u;byId('authView').classList.add('hidden');byId('dashboardView').classList.remove('hidden');byId('sessionArea').classList.remove('hidden');byId('userBadge').textContent=`${u.full_name} · ${u.role}`;byId('projectForm').classList.toggle('hidden',u.role==='reviewer')}async function loadProjects(){const el=byId('projects');el.className='empty';el.textContent='Cargando proyectos…';try{const r=await fetch(`${API}/projects`,{headers:authHeaders()});if(r.status===401)return showLogin('La sesión expiró.');if(!r.ok)throw Error('No fue posible cargar los proyectos.');const ps=await r.json();if(!ps.length){el.textContent='Todavía no hay proyectos.';return}el.className='';el.innerHTML=ps.map(p=>`<article class="project"><span class="status">${esc(p.status)}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||'Sin descripción')}</p><p class="muted">${esc(p.course||'Curso no especificado')} · ${esc(p.academic_level)} · versión ${p.version}</p><a class="btn" href="/authoring.html?project=${encodeURIComponent(p.id)}&title=${encodeURIComponent(p.title)}">Abrir Studio Guiado v7.5</a></article>`).join('')}catch(e){el.className='error';el.textContent=e.message}}async function verify(){if(!token)return showLogin();try{const r=await fetch(`${API}/auth/me`,{headers:authHeaders()});if(!r.ok)throw Error();const u=await r.json();showDashboard(u);loadProjects()}catch{showLogin('La sesión expiró.')}}byId('loginTab').onclick=()=>tab('login');byId('registerTab').onclick=()=>tab('register');byId('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:byId('email').value,password:byId('password').value})}),b=await r.json();if(!r.ok)throw Error(b.detail||'No fue posible iniciar sesión.');token=b.access_token;localStorage.setItem('ucan_access_token',token);showDashboard(b.user);loadProjects()}catch(x){byId('loginMessage').className='error';byId('loginMessage').textContent=x.message}};byId('registerForm').onsubmit=async e=>{e.preventDefault();if(byId('registerPassword').value!==byId('registerPasswordConfirm').value){byId('registerMessage').textContent='Las contraseñas no coinciden.';return}try{const r=await fetch(`${API}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:byId('registerName').value,email:byId('registerEmail').value,password:byId('registerPassword').value})}),b=await r.json();if(!r.ok)throw Error(b.detail||'No fue posible crear la cuenta.');token=b.access_token;localStorage.setItem('ucan_access_token',token);showDashboard(b.user);loadProjects()}catch(x){byId('registerMessage').className='error';byId('registerMessage').textContent=x.message}};byId('projectForm').onsubmit=async e=>{e.preventDefault();const m=byId('formMessage');m.textContent='Creando…';try{const r=await fetch(`${API}/projects`,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({title:byId('title').value,course:byId('course').value,academic_level:byId('level').value,description:byId('description').value})}),b=await r.json();if(!r.ok)throw Error(b.detail||'No fue posible crear el proyecto.');e.target.reset();m.className='success';m.textContent='Proyecto creado. Ábralo para comenzar la actividad.';loadProjects()}catch(x){m.className='error';m.textContent=x.message}};byId('logoutButton').onclick=()=>showLogin('Sesión cerrada.');byId('refreshButton').onclick=loadProjects;fetch(`${API}/auth/registration-config`).then(r=>r.json()).then(c=>byId('domainHelp').textContent=`Dominios permitidos: ${c.allowed_domains.map(d=>'@'+d).join(', ')}`).catch(()=>{});verify();</script></body></html>
