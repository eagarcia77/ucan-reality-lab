<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña · UCAN Reality Lab</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#14231e;background:#eef5f2}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#073f32,#08775d);color:#fff;padding:1.3rem 2rem}.card{max-width:520px;margin:3rem auto;background:#fff;border:1px solid #d6e4de;border-radius:16px;padding:1.4rem;box-shadow:0 8px 24px #0b3f3220}label{display:block;font-weight:750;margin-top:1rem}input{width:100%;padding:.75rem;margin-top:.35rem;border:1px solid #9cb9ae;border-radius:10px;font:inherit}button,a{display:inline-block;border:0;border-radius:10px;padding:.8rem 1rem;background:#08775d;color:#fff;font-weight:800;text-decoration:none;margin-top:1rem;cursor:pointer}.error{color:#a32323}.success{color:#08775d}.muted{color:#52675f}</style></head><body><header><h1>UCAN Reality Lab</h1><div>Restablecer contraseña</div></header><main class="card"><h2>Crear una contraseña nueva</h2><p class="muted">La contraseña debe tener al menos 10 caracteres.</p><form id="resetForm"><label>Nueva contraseña</label><input id="newPassword" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><label>Confirmar contraseña</label><input id="confirmPassword" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><button>Actualizar contraseña</button><p id="message" role="status"></p></form><a href="/">Volver a iniciar sesión</a></main><script>(()=>{const API=location.hostname.endsWith('onrender.com')?'https://ucan-reality-lab.onrender.com/api':'/api',token=new URLSearchParams(location.search).get('token')||'',m=document.getElementById('message');if(!token){m.className='error';m.textContent='El enlace no contiene un token válido.';}document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p!==c){m.className='error';m.textContent='Las contraseñas no coinciden.';return}m.className='';m.textContent='Actualizando…';try{const r=await fetch(`${API}/auth/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:p})}),b=await r.json();if(!r.ok)throw Error(b.detail||'No fue posible actualizar la contraseña.');m.className='success';m.textContent=b.message;document.getElementById('resetForm').reset();}catch(err){m.className='error';m.textContent=err.message}}})();</script></body></html>
