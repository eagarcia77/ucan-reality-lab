server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</body>' '<script src="/logo-inter-1.js?v=8210"></script><script src="/logo-inter-2.js?v=8210"></script><script src="/logo-ucan-1.js?v=8210"></script><script src="/logo-ucan-2.js?v=8210"></script><script src="/brand-header.js?v=8210"></script></body>';
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.(js|html)$ {
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</body>' '<script src="/logo-inter-1.js?v=8210"></script><script src="/logo-inter-2.js?v=8210"></script><script src="/logo-ucan-1.js?v=8210"></script><script src="/logo-ucan-2.js?v=8210"></script><script src="/brand-header.js?v=8210"></script></body>';
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
