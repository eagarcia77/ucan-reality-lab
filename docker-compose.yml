services:
  ucan-reality-lab:
    build:
      context: .
    container_name: ucan-reality-lab-v60
    ports:
      - "${UCAN_PORT:-8151}:8151"
    volumes:
      - ucan_data:/app/app/data
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-UCAN Reality Lab v6.0}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      SKETCHFAB_API_TOKEN: ${SKETCHFAB_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8151/api/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ucan_data:
